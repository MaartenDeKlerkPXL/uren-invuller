<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Uren</title>
    <meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f141b" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Uren">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon-180.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
    <div>
        <h1>Uren</h1>
        <p class="topbar-sub" id="maand-label">&nbsp;</p>
    </div>
</header>

<main>
    <!-- HOOFDSCHERM -->
    <section id="view-app" class="view">
        <div class="card reveal" id="card-invoer">
            <div class="card-head">
                <h2 id="invoer-titel">Nieuwe dag</h2>
                <button type="button" class="link-btn hidden" id="btn-annuleer-bewerken">Annuleren</button>
            </div>

            <form id="form-invoer" class="stack" novalidate>
                <div class="field">
                    <div class="field-kop">
                        <label for="datum">Datum</label>
                        <div class="chips" role="group" aria-label="Snelle datum">
                            <button type="button" class="chip" data-dagen="0">Vandaag</button>
                            <button type="button" class="chip" data-dagen="-1">Gisteren</button>
                        </div>
                    </div>
                    <input type="date" id="datum" required>
                </div>

                <div class="grid-2">
                    <label class="field">
                        <span>Begintijd</span>
                        <input type="time" id="werk-start" class="tijd">
                    </label>
                    <label class="field">
                        <span>Eindtijd</span>
                        <input type="time" id="werk-eind" class="tijd">
                    </label>
                </div>

                <button type="button" class="toggle" id="btn-standby" aria-expanded="false" aria-controls="standby-blok">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                    <span>Standby toevoegen</span>
                </button>

                <div class="standby" id="standby-blok">
                    <div class="standby-inner">
                        <div class="grid-2">
                            <label class="field">
                                <span>Standby vanaf</span>
                                <input type="time" id="standby-start" class="tijd" tabindex="-1">
                            </label>
                            <label class="field">
                                <span>Standby tot</span>
                                <input type="time" id="standby-eind" class="tijd" tabindex="-1">
                            </label>
                        </div>
                    </div>
                </div>

                <div class="preview" id="preview" aria-live="polite"></div>

                <button type="submit" class="btn btn-primary" id="btn-opslaan">
                    <span class="spinner" aria-hidden="true"></span>
                    <span class="btn-label">Zet in urenstaat</span>
                </button>
            </form>
        </div>

        <div class="card reveal" id="card-maand">
            <div class="card-head">
                <h2 id="maand-titel">Deze maand</h2>
                <button type="button" class="icon-btn small" id="btn-vernieuwen" aria-label="Vernieuwen">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>
                </button>
            </div>

            <div class="stats">
                <div class="stat"><span class="stat-num" id="stat-werk">0:00</span><span class="stat-label">Gewerkt</span></div>
                <div class="stat"><span class="stat-num" id="stat-standby">0:00</span><span class="stat-label">Standby</span></div>
                <div class="stat"><span class="stat-num" id="stat-dagen">0</span><span class="stat-label">Dagen</span></div>
            </div>

            <ul class="ritten" id="ritten"></ul>
        </div>

        <div class="acties reveal">
            <a class="btn btn-ghost" id="link-sheet" href="#" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
                Open Google Sheet
            </a>
            <button type="button" class="btn btn-ghost" id="btn-nieuwe-maand">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16v12H4zM4 8l2-4h12l2 4M9 13h6"/></svg>
                Nieuwe maand starten
            </button>
        </div>
    </section>
</main>

<footer class="footer">
    <a href="instructies.html">Op je beginscherm zetten</a>
</footer>

<!-- Rit-acties -->
<dialog id="dlg-rit" class="sheet">
    <form method="dialog">
        <p class="sheet-titel" id="rit-titel"></p>
        <p class="sheet-sub" id="rit-sub"></p>
        <button value="bewerken" class="btn btn-primary">Aanpassen</button>
        <button value="verwijderen" class="btn btn-danger">Verwijderen</button>
        <button value="annuleren" class="btn btn-ghost">Annuleren</button>
    </form>
</dialog>

<!-- Bevestigen -->
<dialog id="dlg-bevestig" class="sheet">
    <form method="dialog">
        <p class="sheet-titel" id="bevestig-titel"></p>
        <p class="sheet-sub" id="bevestig-tekst"></p>
        <button value="ja" class="btn btn-primary" id="bevestig-ja">Ja</button>
        <button value="nee" class="btn btn-ghost">Annuleren</button>
    </form>
</dialog>

<!-- Maand van bestaande uren (eenmalig) -->
<dialog id="dlg-maand" class="sheet">
    <form method="dialog">
        <p class="sheet-titel">Van welke maand zijn deze uren?</p>
        <p class="sheet-sub">Er staan al uren in je sheet. Kies de maand waar ze bij horen, dan kan de app ze goed tonen.</p>
        <select id="maand-keuze" aria-label="Maand"></select>
        <button value="ok" class="btn btn-primary">Opslaan</button>
        <button value="nee" class="btn btn-ghost">Later</button>
    </form>
</dialog>


<div id="toast" role="status" aria-live="polite"></div>

<script src="script.js"></script>
</body>
</html>
